  measure.close: 22rem
  measure.deck: 34rem
emits: [snypd-band, snypd-hero, snypd-feature, snypd-feature-hero, snypd-feature-body, snypd-feature-close, snypd-feature-end, snypd-feature-cta, snypd-feature-next, snypd-feature-meta, snypd-facts, snypd-fact-items, snypd-badge, snypd-twin-link]
settings:
