piece: feature/facts
from: studio
line: "A case as three bands — the cover with a facts strip under it (every `role: fact` field, then the year), the body with its sections numbered, and a close with the call to action beside the next one."
reads: [color.accent, color.border, color.muted, color.text, font.display, font.ui, size.h3, size.small, space.2, space.3, space.4, space.5, space.6, size.cover-cap, measure.close, measure.deck]
needs:
