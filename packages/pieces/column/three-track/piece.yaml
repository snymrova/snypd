piece: column/three-track
from: technical, editorial, studio, folio
line: One grid, three tracks — text, breakout, full. Prose in the text track; charts, diagrams and wide figures break out by `measure.breakout`.
reads: [space.3, space.4, space.6, space.page-top, measure, measure.wide, measure.breakout]
needs:
  space.page-top: var(--space-5)
switches:
  rhythm: { default: loose, of: [loose, tight], description: "The gap between two blocks: `loose` is space.4, four fifths of a line; `tight` is space.3, for reference that is scanned." }
  data:   { default: false, description: "Code blocks and tables take the breakout track too — where data is the content rather than an illustration of it." }
  fit:    { default: false, description: "A chart, diagram or flow shrinks to its drawing and centres on the track, its caption wrapping under the drawing — one left edge per figure." }
  pages:  { default: false, description: "A page's article dissolves into the column as a post's does, so its figures and tables break out of the text track too." }
  shrink: { default: false, description: "Every block in the column may shrink below its content's width — a long unbroken line scrolls or wraps inside its block instead of widening the track." }
