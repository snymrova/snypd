emits: [snypd-list, snypd-list-kicker, snypd-list-filter-name, snypd-list-count, snypd-tiles, snypd-tiles-year, snypd-tiles-mark, snypd-tile, snypd-tile-frame, snypd-tile-name, snypd-tile-label]
pairs:
  column: three-track
