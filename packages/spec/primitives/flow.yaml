name: flow
kind: container
group: evidence
purpose: An ordered procedure with branches — steps plus yes/no decisions — written as YAML and rendered as a diagram. Sugar over diagram that needs no ids for the straight path; emits HowTo schema like steps.
props:
  direction: { type: enum, values: [tb, lr], default: tb }
  caption: { type: markdown, required: true }
  title: { type: string, description: SVG title for assistive tech; defaults to caption }
slots:
  body:
    type: yaml
    description: |
      steps: list of items in order; a string is a step, a map { ask, yes, no } is a decision
      whose yes/no are steps or nested lists; { then: id } jumps to a named step { id, do }.
      A branch with no yes:/no: carries straight on, labelled. A named step that only earlier
      steps jump forward to sits out of the line — the straight path steps over it, and only the
      branch naming it goes there; a jump back to an earlier step is a loop and changes nothing.
    max: { nodes: 40 }
intent: A procedure with at most a handful of decisions that a reader follows top to bottom.
anti-intent: Not for straight lists (use steps). Not for graphs that are not procedures (use diagram).
example: |
  :::flow{caption="Publishing lands one item on main; the agent never checks main out."}
  steps:
    - Draft on snypd/drafts
    - Run lint
    - ask: Lint clean?
      yes: Open preview
      no: { then: fix }
    - id: fix
      do: Fix the reported rule and re-lint
    - Human approves
    - Land that one item on main
  :::
schema-emit: { type: HowTo, from: steps }
budget: { renderMs: 15, svgKb: 25, maxNodes: 40 }
fallback: 'numbered step list with "If ask — yes: … / no: …" lines, followed by the caption'
