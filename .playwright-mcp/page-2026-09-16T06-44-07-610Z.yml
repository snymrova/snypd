                  - /url: "#what-you-get"
              - list [ref=f58e595]:
                - listitem [ref=f58e596]:
                  - strong [ref=f58e597]: One binary.
                  - text: The MCP server, the renderer, the spec, the bundled themes and plugins, SQLite —
                  - code [ref=f58e598]: snypd
                  - text: ", seven verbs, none of which writes content."
                - listitem [ref=f58e599]:
                  - strong [ref=f58e600]: Zero JavaScript by default.
                  - code [ref=f58e601]: page.js.kb
                  - text: is 0 on every route of every shipped theme, and the build refuses a page that breaks it (
                  - link "bench/page.md" [ref=f58e602] [cursor=pointer]:
                    - /url: /snymrova/snypd/blob/r0-readme-ground/bench/page.md
                  - text: ","
                  - link "docs/11 decision 121" [ref=f58e603] [cursor=pointer]:
