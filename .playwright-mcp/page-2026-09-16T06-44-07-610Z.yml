                - link [ref=f58e566] [cursor=pointer]:
                  - /url: /snymrova/snypd/blob/r0-readme-ground/docs/04-runtime-and-renderer.md
                  - img "Bun ≥ 1.4" [ref=f58e567]
              - paragraph [ref=f58e568]:
                - text: A CMS your agent can actually use — markdown in your repo, static HTML out, zero JS. Snypd's
                - strong [ref=f58e569]: only interface is MCP
                - text: ": you write, edit, theme and publish a site from Claude Code, Cursor or Codex, and nothing here has a dashboard. Content is markdown + YAML in a git repo you own; the product is one Bun binary; the output is static HTML with no JavaScript by default, and every chart, diagram and flow on the page is SVG the build wrote."
              - paragraph [ref=f58e570]:
                - link [ref=f58e571] [cursor=pointer]:
                  - /url: /snymrova/snypd/blob/r0-readme-ground/.github/readme/looks/editorial-paper-light.png
                  - img "A post in the editorial theme, built by an agent" [ref=f58e572]
              - generic [ref=f58e573]:
                - heading "Start here" [level=2] [ref=f58e574]
                - 'link "Permalink: Start here" [ref=f58e575] [cursor=pointer]':
                  - /url: "#start-here"
              - paragraph [ref=f58e578]: "Paste this into the harness you already have open:"
              - blockquote [ref=f58e579]:
                - paragraph [ref=f58e580]:
                  - text: Set up snypd here and write me a first post. Ask me what the site is called, then run
                  - code [ref=f58e581]: bunx @snypd/cli init
                  - text: .
              - paragraph [ref=f58e582]:
                - text: That is the whole front door. The agent asks what the site is called, runs
                - code [ref=f58e583]: init
                - text: ", and relays the one thing it cannot do — restart the harness so the tools load. On the far side it picks up from"
                - code [ref=f58e584]: initialize
                - text: ", reads the site and writes the post ("
                - link "docs/08" [ref=f58e585] [cursor=pointer]:
                  - /url: /snymrova/snypd/blob/r0-readme-ground/docs/08-first-run.md
                - text: ).
                - code [ref=f58e586]: npm i -g @snypd/cli
                - text: puts
                - code [ref=f58e587]: snypd
                - text: on your
                - code [ref=f58e588]: PATH
                - text: on macOS (Apple silicon and Intel), Linux (x64 and arm64) and Windows (x64) — one ~85 MB binary,
                - link "published from CI with provenance" [ref=f58e589] [cursor=pointer]:
                  - /url: /snymrova/snypd/blob/r0-readme-ground/packaging
                - text: .
              - generic [ref=f58e590]:
                - heading "What you get" [level=2] [ref=f58e591]
