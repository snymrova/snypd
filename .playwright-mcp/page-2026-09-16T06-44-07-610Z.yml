                  - text: ).
                - listitem [ref=f58e604]:
                  - strong [ref=f58e605]: Thirteen typed primitives, rendered at build time.
                  - text: A
                  - code [ref=f58e606]: chart
                  - text: is inline SVG; a
                  - code [ref=f58e607]: flow
                  - text: is a laid-out graph; a
                  - code [ref=f58e608]: stat
                  - text: without a source fails lint.
                - listitem [ref=f58e609]:
                  - strong [ref=f58e610]: The agent-read surface, on every build.
                  - text: A
                  - code [ref=f58e611]: .md
                  - text: twin beside every page,
                  - code [ref=f58e612]: llms.txt
                  - text: ","
                  - code [ref=f58e613]: feed.xml
                  - text: ","
                  - code [ref=f58e614]: sitemap.xml
                  - text: ", a JSON API, JSON-LD — 8/8 ("
                  - link "bench/latest.md › surface" [ref=f58e615] [cursor=pointer]:
                    - /url: /snymrova/snypd/blob/r0-readme-ground/bench/latest.md
                  - text: ).
                - listitem [ref=f58e616]:
                  - strong [ref=f58e617]: Benchmarks that fail CI.
                  - text: Build speed, cold start, tokens, bytes, axe violations, a live-model kill test — every number in this file links to its row.
                - listitem [ref=f58e618]:
                  - strong [ref=f58e619]: A git repo you own.
                  - text: Every CMS claims no lock-in. This is the only one where you can check it with
                  - code [ref=f58e620]: ls
                  - text: ": markdown and YAML, in your repo, rendered by a binary you have a copy of."
