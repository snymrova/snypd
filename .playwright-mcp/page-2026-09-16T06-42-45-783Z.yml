                  - img "Bun ≥ 1.4" [ref=f57e553]
              - paragraph [ref=f57e554]:
                - text: A CMS your agent can actually use — markdown in your repo, static HTML out, zero JS. Snypd's
                - strong [ref=f57e555]: only interface is MCP
                - text: ": you write, edit, theme and publish a site from Claude Code, Cursor or Codex, and nothing here has a dashboard. Content is markdown + YAML in a git repo you own; the product is one Bun binary; the output is static HTML with no JavaScript by default, and every chart, diagram and flow on the page is SVG the build wrote."
              - paragraph [ref=f57e556]:
                - link [ref=f57e557] [cursor=pointer]:
                  - /url: /snymrova/snypd/blob/r0-readme-ground/.github/readme/looks/editorial-paper-light.png
                  - img "A post in the editorial theme, built by an agent" [ref=f57e558]
              - generic [ref=f57e559]:
