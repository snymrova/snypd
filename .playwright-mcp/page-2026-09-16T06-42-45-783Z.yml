                - 'link "Permalink: Start here" [ref=f57e561] [cursor=pointer]':
                  - /url: "#start-here"
              - paragraph [ref=f57e564]: "Paste this into the harness you already have open:"
              - blockquote [ref=f57e565]:
                - paragraph [ref=f57e566]:
                  - text: Set up snypd here and write me a first post. Ask me what the site is called, then run
                  - code [ref=f57e567]: bunx @snypd/cli init
                  - text: .
              - paragraph [ref=f57e568]:
                - text: That is the whole front door. The agent asks what the site is called, runs
                - code [ref=f57e569]: init
                - text: ", and relays the one thing it cannot do — restart the harness so the tools load. On the far side it picks up from"
                - code [ref=f57e570]: initialize
                - text: ", reads the site and writes the post ("
                - link "docs/08" [ref=f57e571] [cursor=pointer]:
                  - /url: /snymrova/snypd/blob/r0-readme-ground/docs/08-first-run.md
                - text: ).
                - code [ref=f57e572]: npm i -g @snypd/cli
                - text: puts
                - code [ref=f57e573]: snypd
                - text: on your
                - code [ref=f57e574]: PATH
                - text: on macOS (Apple silicon and Intel), Linux (x64 and arm64) and Windows (x64) — one ~85 MB binary,
                - link "published from CI with provenance" [ref=f57e575] [cursor=pointer]:
                  - /url: /snymrova/snypd/blob/r0-readme-ground/packaging
                - text: .
