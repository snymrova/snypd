                  - text: A
                  - code [ref=f57e592]: chart
                  - text: is inline SVG; a
                  - code [ref=f57e593]: flow
                  - text: is a laid-out graph; a
                  - code [ref=f57e594]: stat
                  - text: without a source fails lint.
                - listitem [ref=f57e595]:
                  - strong [ref=f57e596]: The agent-read surface, on every build.
                  - text: A
                  - code [ref=f57e597]: .md
                  - text: twin beside every page,
                  - code [ref=f57e598]: llms.txt
                  - text: ","
                  - code [ref=f57e599]: feed.xml
                  - text: ","
                  - code [ref=f57e600]: sitemap.xml
                  - text: ", a JSON API, JSON-LD — 8/8 ("
