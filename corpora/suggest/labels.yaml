# Ground truth for `snypd bench suggest` (docs/07 S15, gate ≥ 0.80 precision).
#
# Authored by hand from the prose, not from the tool's output: a label says what a careful editor would
# upgrade, and the tool is scored against that. Seven of the twenty posts are labelled `[]` on purpose —
# a shape that looks like a primitive and is not. Precision measured only on posts that *have* an answer
# is not precision, it is a demo.
#
# `at` is a substring that must appear in the source the suggestion replaces. Anchoring on text rather
# than line numbers means editing a post's opening paragraph does not silently relabel it.

# ── posts with an upgrade ─────────────────────────────────────────────────────
