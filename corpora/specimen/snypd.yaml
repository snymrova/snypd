snypd: 1
site:
  name: Specimen
  url: https://specimen.snypd.rocks
  description: The pages a theme is judged on — every block, a long read, a full index, and the titles that break mastheads.
  icon: /media/icon.png
theme:
  use: editorial
types:
  author:
    layout: author
# A feature type (docs/37 §2, W3): the changelog plugin's `release`, whose fields carry roles, so the
# `feature` and `list` pieces have a page to be photographed on (`snypd pieces stills`, board.yaml).
plugins:
  - changelog
