# The editorial theme: a reading-first typographic skin over `base`.
#
# It declares no layouts and no primitives of its own. Every one of the 13 primitives and all 6 layouts
# resolve up the `extends:` chain to `base`, whose markup is semantic and carries one `snypd-<name>` class
# per primitive — which is exactly what `base`'s personality promises. So this theme is tokens plus one
# stylesheet plus one part — the masthead — and the *only* way it can drift from the vocabulary is if
# `base` does.
#
# Dark mode costs nothing here: every colour token is a `light-dark()` pair and `theme.css` sets
# `color-scheme: var(--color-scheme)`, which defaults to `light dark`, so the browser picks — and a
# variation that wants to commit sets the one token instead of restating the palette (U6a). That also
# settles viz — `@snypd/viz` paints its label halo in `Canvas` (docs/07 decision 18), the page's own
# background, which resolves per `color-scheme` with no token declared.
theme: editorial
version: 0.1.0
spec: ^1
extends: base
css: ./theme.css
# ── The one webfont this theme ships (B1, decision 118). Source Serif 4, Adobe's text serif, OFL 1.1 —
# subsetted to Latin, `opsz` pinned, `wght` left as a 400–700 range so body, headings and `strong` all
# come out of one file. 30.33 KB on the wire against a 40 KB lane; `scripts/vendor-font.sh` is what made
# it and what reprints these numbers, so `kb:` below is a claim that can be checked rather than a memory.
#
# This reverses the comment that stood on `font.body` since this theme was written — *"a webfont is a
# network round trip this theme will not spend"*. What it was aimed at was a 300 KB family from a third
# party's origin, and neither half of that is what is here: 30 KB, self-hosted, preloaded, and swapped in
# over a fallback whose metrics are overridden to match, which is the part that keeps `page.cls` at 0.
#
# **No italic, and that is the budget talking.** A Latin roman, its bold and its italic do not fit in
# 40 KB: measured, this file is 30.33 KB and the matching italic is 19.43 KB. The pairs that do fit cost
# something real — roman and italic as single weights is 38.95 KB with no bold at all, which is a
# synthesised heading on every page against a synthesised `<em>` in some paragraphs. Emphasis is the
# cheaper thing to lose, and if the lane ever moves, the italic is the first thing to buy with it. Note
# that `theme.css` turns off synthesised *weight* and not synthesised *style*: 400–700 is real, so faux
# bold would only ever be worse than the axis, while a slanted roman is the only emphasis `<em>` has.
font:
  family: Source Serif 4
  file: ./fonts/source-serif-4-latin.woff2
  weight: 400 700
  kb: 31
  # Computed from both fonts by `scripts/vendor-font.sh`, never by taste: Georgia's letters at this size
  # are 6.2 % narrower than Source Serif's, and its line box is taller, so both are corrected here.
  fallback:
    local: Georgia
    size-adjust: 106.2%
    ascent-override: 97.6%
    descent-override: 31.6%
    line-gap-override: 0%
# One part overridden, three inherited (U1). The shell, footer and entry list are `base`'s.
parts:
  header: ./parts/header.tsx
# No `locations:` of its own: `header` and `footer` are inherited from `base`, and the masthead renders
# the header menu beside the brand (U2).
# What this theme lets a site choose without writing CSS (U3, docs/09 §4.2). Declared here, answered in
# `snypd.yaml › theme.settings`, read by the parts — `logo` and `tagline` by this theme's masthead,
# the other four by `base`'s footer, entry list and post byline, which honour them without being forked.
# Tokens are the palette and become CSS custom properties; these do not, because a part decides what
# each one means.
settings:
  - { id: logo,       type: image,     label: Logo,           group: Identity, info: "Site-relative url of an image — put the file in content/media/. Without one the masthead sets the site's name in type." }
  - { id: tagline,    type: text,      label: Tagline,        group: Identity, info: "One line under the name. Defaults to the site's own description." }
  - { id: showDates,  type: boolean,   label: "Show dates",   group: Posts,    default: true,  info: "Off hides the date on the byline and in every list — for a site whose posts are not news." }
  - { id: dateFormat, type: select,    label: "Date format",  group: Posts,    default: iso, options: [iso, long, short], info: "2026-09-12 · 12 September 2026 · 12 Sep 2026. English month names; the <time> element always carries the machine-readable date." }
  - { id: footerNote, type: richtext,  label: "Footer note",  group: Footer,   info: "One line of markdown above the site name — a licence, a colophon, a copyright." }
  - { id: social,     type: link_list, label: "Social links", group: Footer,   info: "[{ label, url }] in the footer. Links off this site, so they are urls and not refs — a menu of your own pages is content/nav/footer.yaml." }

# ── The three looks this theme ships (U6a, docs/10 §5.2, decision 91). A variation is token *values* over
# the defaults below: `theme.variation: ink` in snypd.yaml, or `theme` › set with `variation`, and nothing
# else moves. A site's own `theme.tokens` still wins over whichever one is chosen, which is the whole
# precedence rule — theme defaults ← variation ← site.
#
# Colour here is OKLCH, and derived where a value really is derived: `oklch(from var(--color-bg) calc(l +
# 0.045) c h)` is "the background, lifted" and stays that as the background moves, where a second hex would
# be a number to keep in sync by hand. That is also why `ink` is eleven tokens and not thirty — the viz
# palette is light-dark() pairs, and `color.scheme: dark` resolves every one of them to its dark side.
variations:
  paper:
    description: Warm cream, oxblood accent, serif throughout — the theme as written.
  ink:
    description: "Dark only: a cool near-black, one cyan, the same measure."
    tokens:
      color.scheme:          dark
      color.bg:              "oklch(0.17 0.012 250)"
      color.surface:         "oklch(from var(--color-bg) calc(l + 0.045) c h)"
      color.text:            "oklch(0.91 0.008 250)"
      color.muted:           "oklch(from var(--color-text) calc(l - 0.24) calc(c + 0.004) h)"
      color.accent:          "oklch(0.79 0.12 205)"
      color.on-accent:       "oklch(from var(--color-bg) calc(l - 0.02) c h)"
      color.border:          "oklch(from var(--color-bg) calc(l + 0.1) c h)"
      # The three viz tokens that are the page rather than the data: a node is a raised surface and a
      # gridline is a hairline, so both follow the background the other ten series colours sit on.
      color.viz.node:        "oklch(from var(--color-bg) calc(l + 0.045) c h)"
      color.viz.node-stroke: "oklch(from var(--color-bg) calc(l + 0.13) c h)"
      color.viz.grid:        "oklch(from var(--color-bg) calc(l + 0.08) c h)"
  broadsheet:
    description: A wider column, sans headlines, tighter leading, a press blue.
    tokens:
      measure:       "38rem"
      font.heading:  "var(--font-ui)"
      leading.body:  "1.5"
      leading.tight: "1.05"
      size.h1:       "clamp(2.4rem, 1.6rem + 3.6vw, 4rem)"
      size.h2:       "clamp(1.5rem, 1.28rem + 1.1vw, 2.05rem)"
      color.accent:  "light-dark(oklch(0.45 0.15 255), oklch(0.78 0.11 245))"

personality: >-
  Long-form reading. One serif column at a comfortable measure, generous leading, a single accent used
  sparingly. Figures, charts, diagrams and flows break out of the column; nothing else does. Zero JS.

tokens:
  # ── Colour. Every value is a light-dark() pair; `color-scheme: var(--color-scheme)` in theme.css does the rest.
  color.scheme:    { default: "light dark", customisable: true, kind: keyword, description: "What `color-scheme` this theme asks the browser for, and therefore which side of every light-dark() pair resolves. `light dark` follows the reader; `dark` or `light` commits." }
  color.bg:        { default: "light-dark(#fdfcfa, #12110f)", customisable: true, kind: color, description: "Page background." }
  color.surface:   { default: "light-dark(#f4f1ea, #1c1a17)", customisable: true, kind: color, description: "Raised blocks — callout, cta, tldr." }
  color.text:      { default: "light-dark(#1a1815, #e8e4dc)", customisable: true, kind: color, description: "Body text." }
  color.muted:     { default: "light-dark(#6b655c, #9a9287)", customisable: true, kind: color, description: "Dates, captions, secondary labels." }
  color.accent:    { default: "light-dark(#8a3324, #e0785f)", customisable: true, kind: color, description: "Links and the one emphatic colour." }
  color.on-accent: { default: "light-dark(#fdfcfa, #12110f)", customisable: true, kind: color, description: "Text on an accent fill." }
  color.border:    { default: "light-dark(#ddd7cb, #2e2b26)", customisable: true, kind: color, description: "Hairlines and block edges." }

  # ── Viz. `@snypd/viz` reads these directly (docs/07 decision 17: the theme brings colour, never geometry).
  color.viz.1:           { default: "light-dark(#8a3324, #e0785f)", customisable: true, kind: color, description: "First series." }
  color.viz.2:           { default: "light-dark(#2f5d62, #7fb2b8)", customisable: true, kind: color, description: "Second series." }
  color.viz.3:           { default: "light-dark(#96702a, #d8ab52)", customisable: true, kind: color, description: "Third series." }
  color.viz.4:           { default: "light-dark(#4a4560, #a49bc4)", customisable: true, kind: color, description: "Fourth series." }
  color.viz.5:           { default: "light-dark(#5c6b3f, #a6bb7c)", customisable: true, kind: color, description: "Fifth series." }
  color.viz.6:           { default: "light-dark(#8a5b6d, #cf98ab)", customisable: true, kind: color, description: "Sixth series." }
  color.viz.axis:        { default: "light-dark(#6b655c, #9a9287)", customisable: true, kind: color, description: "Axis lines." }
  color.viz.grid:        { default: "light-dark(#e6e0d4, #262320)", customisable: true, kind: color, description: "Gridlines." }
  color.viz.tick:        { default: "light-dark(#6b655c, #9a9287)", customisable: true, kind: color, description: "Tick labels." }
  color.viz.label:       { default: "light-dark(#1a1815, #e8e4dc)", customisable: true, kind: color, description: "Node and edge labels." }
  color.viz.edge:        { default: "light-dark(#8f887d, #6f685e)", customisable: true, kind: color, description: "Diagram and flow edges." }
  color.viz.node:        { default: "light-dark(#f4f1ea, #1c1a17)", customisable: true, kind: color, description: "Node fill." }
  color.viz.node-stroke: { default: "light-dark(#c9c2b4, #3a362f)", customisable: true, kind: color, description: "Node outline." }

  # ── Type. One webfont (see `font:` below), then what is left of the stack this theme had before it.
  # `Source Serif 4 fallback` is the generated face in between: Georgia, with its ascent, descent and
  # width overridden to the webfont's, so the swap changes the letters and nothing about where the lines
  # are. A site that points font.body somewhere else drops the face from the slot without the theme
  # having to notice, and a browser that can have neither is exactly where it was.
  #
  # **Iowan Old Style and Palatino Linotype came out of this stack, and the webfont is why.** Iowan ships
  # on macOS and Palatino Linotype on Windows, and both of those machines have Georgia — which the
  # fallback face matches two entries earlier. Every machine that could have reached them now stops
  # before them, so they were two names that could never be read again. What is behind Georgia is Linux
  # and Android, where `Charter` is a real possibility and `serif` is a good one.
  font.body:    { default: "'Source Serif 4', 'Source Serif 4 fallback', Charter, Georgia, ui-serif, serif", customisable: true, kind: font, description: "Prose." }
  font.ui:      { default: "ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif", customisable: true, kind: font, description: "Eyebrows, meta, nav, captions." }
  font.mono:    { default: "ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace", customisable: true, kind: font, description: "Code." }
  font.heading: { default: "var(--font-body)", customisable: true, kind: font, description: "Headings. Defaults to the prose face, which is what this theme has always set them in; point it at font.ui for a sans-headline look." }
  size.body:    { default: "clamp(1.0625rem, 0.98rem + 0.42vw, 1.1875rem)", customisable: true, kind: size, description: "Body size; fluid between phone and desktop." }
  size.h1:      { default: "clamp(2.1rem, 1.55rem + 2.7vw, 3.4rem)", customisable: true, kind: size, description: "Post and index title." }
  size.h2:      { default: "clamp(1.45rem, 1.24rem + 1.05vw, 1.95rem)", customisable: true, kind: size, description: "Section heading." }
  size.h3:      { default: "clamp(1.15rem, 1.06rem + 0.45vw, 1.35rem)", customisable: true, kind: size, description: "Sub-heading." }
  size.small:   { default: "0.8125rem", customisable: true, kind: size, description: "Meta and caption." }
  leading.body: { default: "1.65", customisable: true, kind: number, description: "Prose line height." }
  leading.tight: { default: "1.15", customisable: true, kind: number, description: "Heading line height." }
  measure:      { default: "34rem", customisable: true, kind: size, description: "Width of the reading column — the theme's single most opinionated number." }

  # ── Space. One ratio, six steps; every gap in theme.css is one of these.
  space.1: { default: "0.25rem", customisable: true, kind: size, description: "Hairline gap." }
  space.2: { default: "0.5rem",  customisable: true, kind: size, description: "Inside a line." }
  space.3: { default: "1rem",    customisable: true, kind: size, description: "Between paragraphs." }
  space.4: { default: "1.75rem", customisable: true, kind: size, description: "Around a block." }
  space.5: { default: "3rem",    customisable: true, kind: size, description: "Between sections." }
  space.6: { default: "5rem",    customisable: true, kind: size, description: "Page top and bottom." }
  radius:  { default: "4px",     customisable: true, kind: size, description: "Corner radius; small on purpose." }
