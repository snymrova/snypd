# The base theme: every primitive and layout, semantic HTML, no JS. The floor other themes extend
# (`extends: base`) and the theme Gate B is measured on (docs/07 S6, S12). Its one stylesheet is
# behaviour, not looks (U7): what the markup's popover, dialog, details and footnote cards need to
# work, in the `snypd.base` layer under every theme's own.
theme: base
version: 0.1.0
spec: ^1
css: ./theme.css
# `home` (S25): the page that carries `home: true` — its body, then the newest posts; the list itself is at /posts/.
layouts: [post, page, index, term, author, home]
# The document around the layouts, as slots a child theme overrides one file at a time (docs/09 U1).
parts:
  shell:   ./parts/shell.tsx
  header:  ./parts/header.tsx
  footer:  ./parts/footer.tsx
  entries: ./parts/entries.tsx
  # Rendered by the post layout between the byline and the body, and empty here (U6b): a theme that wants
  # a contents list overrides this one file instead of forking the layout that would have to draw it.
  toc:     ./parts/toc.tsx
  # The pause control a page with an autoplaying clip or a marquee carries (docs/18, decision 190); empty
  # on every other page. The header renders it; a theme with its own masthead places it.
  motion:  ./parts/motion.tsx
# The menus a site can give this theme, one `content/nav/<location>.yaml` each (docs/09 §4.3, U2). The
# header and footer parts render them; a file for a location not listed here is a lint warning.
locations: [header, footer]
# The two the header reads (decision 273). A child that declares the same id replaces the declaration in
# place — editorial's tagline defaults to the site's description, studio's logo sets the display face.
settings:
  - { id: logo,    type: image, label: Logo,    group: Identity, info: "Site-relative url of an image — put the file in content/media/. Without one the header sets the site's name." }
  - { id: tagline, type: text,  label: Tagline, group: Identity, info: "One line with the name. Without one, none is shown." }
primitives:
  callout:   ./primitives/callout.tsx
  chart:     ./primitives/chart.tsx
  cover:     ./primitives/cover.tsx
  cta:       ./primitives/cta.tsx
  diagram:   ./primitives/diagram.tsx
  faq:       ./primitives/faq.tsx
  figure:    ./primitives/figure.tsx
  flow:      ./primitives/flow.tsx
  logo-wall: ./primitives/logo-wall.tsx
  pullquote: ./primitives/pullquote.tsx
  stat:      ./primitives/stat.tsx
  stat-row:  ./primitives/stat-row.tsx
  steps:     ./primitives/steps.tsx
  tldr:      ./primitives/tldr.tsx
personality: Unstyled. Semantic HTML only, one class per primitive (`snypd-<name>`), so a child theme styles it without touching markup.
