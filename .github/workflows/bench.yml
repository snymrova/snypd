name: test + bench
# `${{ … }}` inside a YAML *flow* mapping has to be quoted: `{` and `}` are structural there, so
# `{ bun-version: ${{ matrix.bun }} }` is a parse error and the run fails in 0 s with "workflow file
# issue" and no log. This file carried that from S1 and nobody saw it, because the repo had no remote
# until S18d′ — the first push is what ran it. Quoted, and both workflows are parsed in `packaging`'s
# test now so a third one cannot arrive broken.
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix: { bun: ["1.4.0", "1.3.14"] }   # 1.4.x primary, 1.3.14 known-good lane (docs/04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ matrix.bun }}" }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run snypd bench --ci
        continue-on-error: ${{ matrix.bun != '1.4.0' }}   # fallback lane reports, primary lane enforces
      # D1's evidence. `bun test` above already gates the kill test at its known state (agent.test.ts);
      # this runs it for the transcript, and exits non-zero while `agent.goal` is short of 1 — which it is,
      # on purpose, until the write model is fixed (docs/07 §6). Flip this to enforcing in the same PR.
      - run: bun run snypd bench agent
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with: { name: "bench-${{ matrix.bun }}", path: bench/ }
