name: test + bench
# `${{ … }}` inside a YAML *flow* mapping has to be quoted: `{` and `}` are structural there, so
# `{ bun-version: ${{ matrix.bun }} }` is a parse error and the run fails in 0 s with "workflow file
# issue" and no log. This file carried that from S1 and nobody saw it, because the repo had no remote
# until S18d′ — the first push is what ran it. Quoted, and both workflows are parsed in `packaging`'s
# test now so a third one cannot arrive broken.
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  bench:
    strategy:
      fail-fast: false
      # Bun 1.4 only since 14 Sep 2026 (docs/04). The 1.3.14 lane is gone: it could not read the lockfile
      # 1.4 writes, so it resolved fresh and tolerated a lockfile that had drifted, while this lane refused.
      matrix: { bun: ["1.4.0"] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ matrix.bun }}" }
      - name: install
        run: bun install --frozen-lockfile
      # A runner has no git author identity, and neither does a fresh laptop or a container. `init`
      # commits the scaffold, so without one this suite fails where a first-timer fails — which is what
      # the first run of this workflow found (S18d′). The product now says so; the happy path is tested
      # here, and the no-identity path in `site.test.ts`.
      - name: git identity
        run: |
          git config --global user.email "ci@snypd.rocks"
          git config --global user.name "snypd CI"
      - run: bun run typecheck
      - run: bun test
      - run: bun run snypd bench --ci
      # D1's evidence, and an artefact rather than a gate. `bun test` above already enforces the kill test
      # (`agent.test.ts`, green at 11/11 since S17b closed the write model), so this step exists to produce
      # `bench/agent.md` and the transcript for the upload below. It stays non-enforcing because failing
      # every PR on a duplicate of a gate that already ran buys nothing. The line this replaces said
      # `agent.goal` was "short of 1, on purpose" — true when it was written in S1, false since S17b.
      # S22 (docs/11 E9): every look every theme ships — six today — built from the theme fixture, measured
      # at 1280 and 390 px and photographed. The pictures are the shelf's (`snypd.rocks/themes`); the gate
      # under them is the page suite's, per look: 0 KB JS, the font under its declaration, 0 axe violations.
      # `--ci` fails on any of the three; the PNGs and `bench/gallery.md` ride in the artefact below.
      - run: bun run snypd bench gallery --ci
      - run: bun run snypd bench agent
        continue-on-error: true
      # S29 · R4: the registry demo (docs/20 §2.4) — a `work` type declared in fifteen lines of the studio
      # specimen's snypd.yaml, and what every tool says about it, twelve steps checked against the sentence
      # each should answer. `registry.test.ts` enforces it in `bun test` above; this step makes the record
      # (`bench/registry.md` and the transcript) for the artefact, and is non-enforcing for `agent`'s reason.
      - run: bun run snypd bench registry
        continue-on-error: true
      # S18g, and the same split for the same reason. `bun test` above enforces first run exactly
      # (`smoke/onboard.test.ts`: three actions, not 3.2), so this step exists to produce
      # `bench/onboard.md` — the breakdown decision 65 asks for, and the artefact F1 is read off.
      # It is non-enforcing, and green: `onboard.handoff` is **3** against F1's budget of 5 since L4,
      # which is the first session to walk the door docs/08 §2 shows — it read 6 in S18g and 5 from
      # S19c, both on the second door, which is now its own row (`onboard.handoff.relay`, still 5).
      # Both counts are pinned exactly in the test, in both directions, so neither can drift unnoticed.
      # `onboard.live` rides here too (docs/31 §5 · L4): the walk ends at a URL from a stub `wrangler`
      # — `core/src/wrangler.stub.sh`, no account and no network, the way `push.test.ts` uses a bare
      # repo for GitHub. The same walk against the *released launcher* is `docker/box clean`, which is
      # not a CI step: it cross-compiles a platform binary, and the seam it proves does not move on
      # every pull request.
      - run: bun run snypd bench onboard
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with: { name: "bench-${{ matrix.bun }}", path: bench/ }
  # H4 (docs/11 finding 4): the six properties in `packages/bench/props/`, at ten times the budget the
  # ordinary suite gives them and on a seed no run has used before — the run's own id, printed on the
  # first line of the log. `bun test` above already runs the same properties at ×1 on a fixed seed, so a
  # red here is a *new* input, and `SNYPD_PROPS_SEED=<that id> bun test props` is the whole reproduction.
  properties:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      - run: bun install --frozen-lockfile
      - run: |
          git config --global user.email "ci@snypd.rocks"
          git config --global user.name "snypd CI"
      - run: bun test props
        env: { SNYPD_PROPS_RUNS: "10", SNYPD_PROPS_SEED: "${{ github.run_id }}" }
