name: release
# One job, one tag, five packages. `bun build --compile --target=…` cross-compiles every platform from
# this runner (it downloads the target's runtime and embeds it), so there is no build matrix and no
# artefact passing between jobs — which also means one provenance attestation chain, from one workflow
# run, over everything published.
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and `npm publish --dry-run` only — publishes nothing"
        type: boolean
        default: true

permissions:
  contents: write   # the GitHub release and its tarballs
  id-token: write   # npm provenance: the attestation is signed with this run's OIDC identity

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      # npm, not bun, does the publishing: `--provenance` is npm's, and provenance is half the argument
      # for shipping this way at all (`07` S18d′ — a pipe to a shell has no attestation to offer).
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }

      - run: bun install --frozen-lockfile
      # `init` commits the scaffold, and a runner has no git author identity (S18d′). Same step as
      # `bench.yml`: the suite tests the happy path, `site.test.ts` tests the machine that has none.
      - name: git identity
        run: |
          git config --global user.email "ci@snypd.rocks"
          git config --global user.name "snypd CI"
      - run: bun run typecheck
      - run: bun test

      # The tag is the version, or this is not a release. Caught here rather than after four packages
      # are on a registry that only unpublishes for 72 hours.
      - name: tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "refs/tags/v$v" = "${{ github.ref }}" ] || { echo "tag ${{ github.ref }} ≠ v$v"; exit 1; }

      - name: build every platform package
        run: bun packaging/npm/build.ts --out=dist/release --formula

      - name: what is about to be published
        run: |
          for d in dist/release/npm/@snypd/* dist/release/npm/launcher; do
            (cd "$d" && npm publish --dry-run --access public 2>&1 | tail -20)
          done

      # Platform packages first — the glob expands before the launcher, and the order is the point: the
      # launcher's `optionalDependencies` are exact pins, so publishing it ahead of the binaries leaves a
      # window in which `npm i @snypd/cli` resolves a launcher with nothing to run. The launcher is
      # staged at `npm/launcher` rather than `npm/@snypd/cli` precisely so this glob cannot catch it
      # (S18h): it is `@snypd/cli` on the registry, and a role-named directory is what keeps the order
      # in the shell rather than in a comment.
      #
      # Skipping what is already on the registry makes a retry safe. Publishing is six calls and any one
      # of them can fail for a reason that has nothing to do with the artefact — a token without
      # `bypass 2fa`, which is how v0.1.0's first attempt failed, or a network blip on the fourth of six.
      # Without this, the retry after a partial run dies on EPUBLISHCONFLICT for the packages that did
      # land, and the only way forward is a version bump nobody's code needed.
      - name: publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          for d in dist/release/npm/@snypd/* dist/release/npm/launcher; do
            name=$(node -p "require('$PWD/$d/package.json').name")
            version=$(node -p "require('$PWD/$d/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on the registry — skipping"
              continue
            fi
            echo "publishing $name@$version"
            (cd "$d" && npm publish --provenance --access public)
          done

      - name: github release
        if: ${{ github.event_name == 'push' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag \
            dist/release/release/* packaging/homebrew/snypd.rb

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/release/release/
            packaging/homebrew/snypd.rb
